version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trucker-platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trucker_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: trucker-platform-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/trucker_platform
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: npm run dev

  customer-web:
    build:
      context: ./apps/customer-web
      dockerfile: Dockerfile
    container_name: trucker-platform-customer-web
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./apps/customer-web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
